name: Test 🧪

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Run tests 🦀
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # src/routeTree.gen.ts is generated by the router and gitignored, so it does
      # not exist on a clean checkout. Generate it before the type check.
      - name: Generate route tree
        run: bun routes:generate

      - name: Knip
        run: bun knip

      - name: Biome
        run: bun biome check

      - name: TypeScript
        run: bun tsc --noEmit

      # This is a cargo-generate template: src-tauri carries {{project-name}}
      # placeholders (an invalid Cargo package name) and ships an empty icons
      # directory. Substitute a throwaway name and generate icons so the Rust
      # toolchain can actually build the crate.
      - name: Scaffold template for native build
        run: |
          sed -i \
            -e 's/{{project-name-snake}}/test_app/g' \
            -e 's/{{project-name}}/test-app/g' \
            -e 's/{{description}}/Test app/g' \
            src-tauri/Cargo.toml src-tauri/src/main.rs src-tauri/src/lib.rs src-tauri/tauri.conf.json
          magick -size 1024x1024 xc:'#4f46e5' "$RUNNER_TEMP/icon-source.png"
          bunx @tauri-apps/cli icon "$RUNNER_TEMP/icon-source.png" -o src-tauri/icons

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
