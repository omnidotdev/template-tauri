name: Test 🧪

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Run tests 🦀
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # pin Bun so the toolchain does not drift with floating latest
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf imagemagick

      # src/routeTree.gen.ts is generated by the router and gitignored, so it does
      # not exist on a clean checkout. Generate it before the type check.
      - name: Generate route tree
        run: bun routes:generate

      - name: Knip
        run: bun knip

      - name: Biome
        run: bun biome check

      - name: TypeScript
        run: bun tsc --noEmit

      # A raw template checkout carries {{project-name}} placeholders (an invalid
      # Cargo package name) and ships no icons, so CI substitutes a throwaway name
      # and generates icons to build the crate. Both halves are guarded so a
      # generated project, which has a real valid name and real icons, skips them:
      # the rename runs only while placeholders remain, so it never rewrites a real
      # crate name once the name has been filled in (a global name replace that
      # also touches this workflow would otherwise turn the sed into
      # s/<realname>/test_app/g and corrupt the manifest), and icons are generated
      # only when absent.
      - name: Scaffold template for native build
        run: |
          if grep -q '{{' src-tauri/Cargo.toml; then
            sed -i \
              -e 's/{{project-name-snake}}/test_app/g' \
              -e 's/{{project-name}}/test-app/g' \
              -e 's/{{description}}/Test app/g' \
              src-tauri/Cargo.toml src-tauri/src/main.rs src-tauri/src/lib.rs src-tauri/tauri.conf.json
          fi
          if [ ! -f src-tauri/icons/icon.ico ]; then
            convert -size 1024x1024 xc:'#4f46e5' "$RUNNER_TEMP/icon-source.png"
            bunx @tauri-apps/cli icon "$RUNNER_TEMP/icon-source.png" -o src-tauri/icons
          fi

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
