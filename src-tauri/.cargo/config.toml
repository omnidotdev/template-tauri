# Align native library LOAD segments to 16 KiB so the app runs on Android 15+
# devices with 16 KiB memory pages (required by Google Play as of Nov 2025).
# Rust's linker defaults to 4 KiB page alignment for Android targets regardless
# of the NDK version, so the page size must be forced per target.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.i686-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
