[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Omni <team@omni.dev>"]
description = "{{description}}"
license = "Apache-2.0"
repository = "https://github.com/omnidotdev/{{project-name}}"

[lib]
name = "{{project-name-snake}}_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# Mobile plugins (also usable on desktop, registered unconditionally in lib.rs)
tauri-plugin-deep-link = "2"
tauri-plugin-geolocation = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# cfg(desktop) is a compile-time cfg Tauri sets in build.rs; Cargo's dependency
# resolver does not understand it, so a [target.'cfg(desktop)'] section never
# activates and the updater would never be pulled in. Gate on the built-in
# target_os cfgs the resolver does understand instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
